# Legacy numeric ids referenced by the shaders, mapped to modern block names,
# plus light color groups for colored lighting. Unknown names are ignored and
# Minecraft 1.12 resolves its own ids natively.

# --- light color groups (colored lighting) ---
# 200 warm orange: torches, fire, lit furnaces
block.200=torch wall_torch fire campfire furnace:lit=true blast_furnace:lit=true smoker:lit=true candle
# 201 orange red: lava
block.201=lava lava_cauldron
# 202 cyan: soul fire variants
block.202=soul_torch soul_wall_torch soul_campfire soul_lantern soul_fire
# 203 red: redstone
block.203=redstone_torch redstone_wall_torch redstone_ore:lit=true deepslate_redstone_ore:lit=true redstone_block
# 204 warm yellow: lanterns and glowstone
block.204=lantern soul_lantern glowstone shroomlight
# 205 pale cyan: sea lantern
block.205=sea_lantern
# 206 orange: jack-o-lantern
block.206=jack_o_lantern
# 207 white: beacons and end rods
block.207=beacon end_rod ochre_froglight verdant_froglight pearlescent_froglight glow_lichen cave_vines:berries=true cave_vines_plant:berries=true

